version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: notaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-notaria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notaria_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-notaria_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-notaria_user} -d ${POSTGRES_DB:-notaria_db}']
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - notaria_network

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: notaria_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notaria_user}:${POSTGRES_PASSWORD:-notaria_pass}@postgres:5432/${POSTGRES_DB:-notaria_db}?schema=public
      NODE_ENV:     production
    ports:
      - '${PORT:-8000}:8000'
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:     ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8000/api/v1/health || exit 1']
      interval: 30s
      timeout:  10s
      retries:  3
    networks:
      - notaria_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  notaria_network:
    driver: bridge
